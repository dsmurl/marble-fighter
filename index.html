<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marble Fighter</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #0a0a0f;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #eaeaea;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        background: rgba(0, 0, 0, 0.35);
        padding: 8px 12px;
        border-radius: 6px;
        pointer-events: none;
        user-select: none;
      }
      #endgame-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(4, 4, 8, 0.72);
        backdrop-filter: blur(6px);
        opacity: 1;
        transition: opacity 0.2s ease;
        z-index: 10;
      }
      #endgame-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .endgame-card {
        min-width: 280px;
        padding: 32px 40px;
        border-radius: 16px;
        text-align: center;
        font-family: system-ui, sans-serif;
        color: #f4f4f4;
        background: linear-gradient(160deg, rgba(24, 24, 32, 0.95), rgba(10, 10, 16, 0.95));
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        animation: endgame-pop 0.25s ease;
      }
      @keyframes endgame-pop {
        from {
          transform: scale(0.85);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .endgame-card.win {
        border-color: rgba(255, 214, 92, 0.5);
        box-shadow: 0 0 40px rgba(255, 214, 92, 0.25), 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .endgame-card.win .endgame-title {
        color: #ffd65c;
        text-shadow: 0 0 20px rgba(255, 214, 92, 0.6);
      }
      .endgame-card.lose {
        border-color: rgba(255, 90, 90, 0.5);
        box-shadow: 0 0 40px rgba(255, 90, 90, 0.25), 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .endgame-card.lose .endgame-title {
        color: #ff6f6f;
        text-shadow: 0 0 20px rgba(255, 90, 90, 0.6);
      }
      .endgame-title {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }
      .endgame-subtitle {
        font-size: 14px;
        color: #c8c8d0;
        margin-bottom: 24px;
      }
      #endgame-restart {
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 32px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        background: #eaeaea;
        color: #101014;
        transition: transform 0.1s ease, background 0.15s ease;
      }
      #endgame-restart:hover {
        background: #ffffff;
        transform: translateY(-1px);
      }
      #endgame-restart:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud">
      <div><strong>Marble Fighter</strong></div>
      <div>WASD / Arrows — roll</div>
      <div>Space — jump</div>
      <div>Left-click — punch toward cursor</div>
      <div>Knock the AI marble off the platform to win</div>
    </div>
    <div id="endgame-overlay" class="hidden">
      <div class="endgame-card" id="endgame-card">
        <div class="endgame-title" id="endgame-title">YOU WIN</div>
        <div class="endgame-subtitle" id="endgame-subtitle"></div>
        <button id="endgame-restart">OK</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
